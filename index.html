<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workroom Mini - Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Brand Header -->
    <header class="auth-header">
      <div class="auth-brand">
        <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="9" y1="9" x2="21" y2="9"></line>
        </svg>
        <span class="brand-name">Workroom Mini</span>
      </div>
      <p class="auth-subtitle">A simple, focused workspace for your projects and tasks.</p>
    </header>

    <!-- Auth Card -->
    <main class="auth-card">
      <!-- Tabs to switch between Login and Sign Up -->
      <nav class="auth-tabs" aria-label="Authentication modes">
        <button type="button" class="auth-tab active" id="tab-login" aria-selected="true" aria-controls="login-panel">
          Log In
        </button>
        <button type="button" class="auth-tab" id="tab-signup" aria-selected="false" aria-controls="signup-panel">
          Create Account
        </button>
      </nav>

      <!-- Inline Error Banner -->
      <div class="auth-error-banner" id="auth-error" role="alert" style="display: none;"></div>

      <!-- Login Form Panel -->
      <section id="login-panel" class="auth-panel" role="region" aria-labelledby="tab-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              name="username"
              autocomplete="username"
              placeholder="Enter your username"
              required
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
            Log In
          </button>
        </form>
      </section>

      <!-- Sign Up Form Panel -->
      <section id="signup-panel" class="auth-panel" role="region" aria-labelledby="tab-signup" style="display: none;">
        <form id="signup-form" novalidate>
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input
              type="text"
              id="signup-username"
              name="username"
              autocomplete="username"
              placeholder="Choose a username"
              required
            >
            <span class="form-hint">At least 2 characters. Usernames are unique.</span>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              name="password"
              autocomplete="new-password"
              placeholder="Create a password"
              required
            >
            <span class="form-hint">At least 6 characters.</span>
          </div>

          <div class="form-group">
            <label for="signup-confirm">Confirm password</label>
            <input
              type="password"
              id="signup-confirm"
              name="confirm_password"
              autocomplete="new-password"
              placeholder="Repeat your password"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn">
            Create Account
          </button>
        </form>
      </section>
    </main>

    <footer class="auth-footer">
      <span>Persistent local SQLite &bull; Python Flask</span>
    </footer>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
